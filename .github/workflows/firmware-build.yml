# Started by hand only (workflow_dispatch): it never runs on a push or a pull request, because compiling a firmware image in the official ESP-IDF container takes
# many minutes of GitHub Actions time. It builds the universal ("generic") image of one node repository with tools/build_node.sh, in PUBLIC mode (no secrets/generic.conf,
# so no fleet secret can get into the image), checks that the image carries the version of armor.project.json and that the fleet secret is empty, and uploads the
# image as an artifact. It uses no secret and signs nothing: the signature of a release image stays a local step.

name: Firmware build (manual)

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Node repository to build"
        type: choice
        required: true
        default: ARMOR-HMI
        options:
          - ARMOR-HMI
          - ARMOR-ALARM
          - ARMOR-ELECTRICAL
          - ARMOR-RADAR
          - ARMOR-SOLAR
      board:
        description: "Board (empty = the default board of the project, for example lcd7box, s3-wifi or s3-eth)"
        type: string
        required: false
        default: ""
      ref:
        description: "Branch, tag or commit of that repository"
        type: string
        required: true
        default: main
      idf_image:
        description: "ESP-IDF container"
        type: string
        required: true
        default: espressif/idf:v5.5.5

permissions:
  contents: read

jobs:
  build:
    name: Build the universal image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT: ${{ inputs.project }}
      BOARD: ${{ inputs.board }}
      IDF_IMAGE: ${{ inputs.idf_image }}
    steps:
      - name: Check the inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BOARD" =~ ^[a-z0-9][a-z0-9-]{0,31}$ || -z "$BOARD" ]] || { echo "::error::the board must be lowercase letters, digits and dashes"; exit 1; }
          [[ "$IDF_IMAGE" =~ ^espressif/idf:v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::the container must be espressif/idf:vX.Y[.Z]"; exit 1; }

      - name: Check out the node repository
        uses: actions/checkout@v5
        with:
          repository: JuanenRac/${{ inputs.project }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Make sure the build has no fleet secret to take
        shell: bash
        run: |
          set -euo pipefail
          # secrets/ is git-ignored, so a checkout has none; this stops a future change that would commit one
          if [ -e secrets/generic.conf ]; then
            echo "::error::secrets/generic.conf is in the repository; a public image must not be built with it"
            exit 1
          fi

      - name: Build the image in the ESP-IDF container
        shell: bash
        env:
          ARMOR_IDF_IMAGE: ${{ inputs.idf_image }}
        run: |
          set -euo pipefail
          # the container is limited to the cores of this runner (build_node.sh asks for cores 0-3 by default)
          export ARMOR_BUILD_CPUSET="0-$(( $(nproc) - 1 ))"
          if [ -n "$BOARD" ]; then
            bash tools/build_node.sh generic "$BOARD"
          else
            bash tools/build_node.sh generic
          fi

      - name: Check the version in the image and that no fleet secret got in
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(dist/generic-*.bin)
          [ "${#images[@]}" -eq 1 ] || { echo "::error::expected exactly one dist/generic-*.bin, found ${#images[@]}"; exit 1; }
          image="${images[0]}"
          version="$(python3 -c 'import json; print(json.load(open("armor.project.json", encoding="utf-8"))["version"])')"
          if ! python3 - "$image" "$version" <<'PY'
          import re, sys
          data = open(sys.argv[1], "rb").read()
          sys.exit(0 if re.search(rb"(?<![0-9.])" + re.escape(sys.argv[2].encode()) + rb"(?![0-9])", data) else 1)
          PY
          then
            echo "::error::$image does not carry the version $version of armor.project.json (the version has to be raised BEFORE the build)"
            exit 1
          fi
          echo "version $version found in $image"
          # the fleet secret of the build: absent or empty in the configuration that was used
          for config in build/generic-*/sdkconfig; do
            if grep -E '^CONFIG_ARMOR_FLEET_SECRET="[^"]+"' "$config" >/dev/null; then
              echo "::error::$config carries a non-empty CONFIG_ARMOR_FLEET_SECRET: a public image must not"
              exit 1
            fi
            echo "no fleet secret in $config"
          done
          sha256sum "$image" | tee "$image.sha256"
          {
            echo "### $PROJECT ($version)"
            echo "- image: \`$(basename "$image")\`, $(stat -c %s "$image") bytes"
            echo "- container: \`$IDF_IMAGE\`"
            echo "- sha256: \`$(cut -d' ' -f1 "$image.sha256")\`"
            echo "- not signed: the signature of a release image is made locally"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project }}-generic-image
          path: |
            dist/generic-*.bin
            dist/generic-*.bin.sha256
          if-no-files-found: error
          retention-days: 14
